name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup node version
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Check TypeScript types
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # On a push to main:
      # - if changeset files exist, opens/updates a "Version Packages" PR
      # - if none remain (PR merged), publishes to npm
      #
      # npm auth is OIDC Trusted Publishing (id-token: write above + the trusted
      # publisher configured on npmjs for this repo and this workflow filename).
      # Do NOT set NPM_TOKEN / NODE_AUTH_TOKEN here: setup-node writes
      # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and a set-but-empty value
      # makes npm use that token instead of OIDC. Provenance is generated
      # automatically for a public package published from a public repo.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: npm run changeset -- version
          publish: npm run publish-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
