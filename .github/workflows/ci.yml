name: CI

on: pull_request

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a changeset
        run: |
          files=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" -- '.changeset/*.md' ':!.changeset/README.md' || true)
          if [ -z "$files" ]; then
            echo "::error title=Missing changeset::This PR adds no changeset and is blocked. If the change should reach users, run 'npm run changeset'. If it should NOT trigger a release (CI, docs, chores), run 'npx changeset --empty'. How to publish: https://github.com/content-island/content-island-ai-skill/wiki/Publishing-a-new-version"
            exit 1
          fi
          echo "Changeset detected: $files"

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
